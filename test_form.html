<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Тест регистрации</title>
</head>
<body>
    <h2>🔍 Тест регистрации</h2>
    <form method="POST" action="api/register.php" accept-charset="UTF-8">
        <input type="text" name="username" placeholder="Имя" value="Тест_123" required>
        <br><br>
        <input type="email" name="email" placeholder="Email" value="test@example.com" required>
        <br><br>
        <input type="password" name="password" placeholder="Пароль" value="123456" required>
        <br><br>
        <button type="submit">Зарегистрироваться</button>
    </form>
    <p style="color:red">Если ошибка повторится, используй тест через PowerShell (см. ниже)</p>
</body>
</html>
